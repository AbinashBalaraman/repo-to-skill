name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Byte-compile
        run: python -m compileall -q src/r2s

  installed-artifact:
    name: installed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl

      # The suite runs against the source tree, so it cannot catch data files that are
      # missing from the wheel or paths resolved relative to the repository root. Run
      # the CLI from outside the checkout to prove the package is self-contained.
      - name: Run the console script outside the checkout
        working-directory: /tmp
        run: |
          /tmp/clean/bin/r2s --version
          /tmp/clean/bin/r2s profiles

      - name: Packaged data is present in the wheel
        run: |
          /tmp/clean/bin/python - <<'PY'
          from importlib.resources import files
          required = [
              "capabilities.json",
              "catalog/providers.json",
              "catalog/effects.json",
              "catalog/stand-ins/index.json",
              "harness-profiles/bare.json",
              "harness-profiles/claude-code.json",
              "harness-profiles/full.json",
              "harness-profiles/workbuddy.json",
              "schemas/inventory.schema.json",
              # Stand-in scripts are executable payload, not just data: a stand-in whose
              # script is missing from the wheel is a stand-in that cannot run.
              "catalog/stand-ins/scripts/srt_from_text.py",
              "catalog/stand-ins/scripts/gradient_card.py",
              "catalog/stand-ins/scripts/ken_burns.py",
              "catalog/stand-ins/scripts/vertical_cut.py",
              "catalog/stand-ins/scripts/flag_unverifiable.py",
              "catalog/stand-ins/scripts/deferred_handoff.py",
              "catalog/stand-ins/scripts/no_op_report.py",
          ]
          root = files("r2s").joinpath("data")
          missing = [r for r in required if not root.joinpath(r).is_file()]
          if missing:
              raise SystemExit(f"missing from the wheel: {missing}")
          print(f"all {len(required)} packaged data files present")
          PY

      - name: Every stand-in's declared script resolves from the installed package
        working-directory: /tmp
        run: |
          /tmp/clean/bin/r2s standins
          /tmp/clean/bin/python - <<'PY'
          from r2s import execute
          from r2s.capability.vocab import StandinCatalog

          catalog = StandinCatalog.load()
          runnable = 0
          for entry in catalog.all():
              spec = execute.exec_spec(entry)
              if spec is None:
                  # Must still say why, or the gap is silent.
                  assert execute.unavailable_reason(entry), entry["id"]
                  continue
              assert execute.script_path(spec["script"]).is_file(), entry["id"]
              runnable += 1
          print(f"{runnable} stand-in(s) resolve to a shipped script")
          PY

      - name: A stand-in actually runs from the installed package
        working-directory: /tmp
        run: |
          mkdir -p run-out
          echo '{"inputs": {"text": "First sentence. Second one here."}, "out_dir": "run-out"}' \
            | /tmp/clean/bin/python \
                "$(/tmp/clean/bin/python -c 'from r2s import execute; print(execute.script_path("srt_from_text.py"))')"
          test -f run-out/subtitles.srt
          grep -q -- '-->' run-out/subtitles.srt

      - name: Extract a repository using only the installed package
        working-directory: /tmp
        run: |
          mkdir -p smoke/src
          cat > smoke/pyproject.toml <<'TOML'
          [project]
          name = "smoke"
          version = "1.0"
          dependencies = ["requests", "click"]
          TOML
          cat > smoke/src/cli.py <<'PY'
          import click
          import requests


          @click.command()
          def publish():
              """Publish the digest."""
              requests.post("https://example.test/hook")
          PY
          /tmp/clean/bin/r2s extract smoke --out smoke-out
          /tmp/clean/bin/r2s validate smoke-out/inventory.draft.json || true
          test -f smoke-out/inventory.draft.json

  design-gates:
    name: design gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Every harness profile loads and its capability IDs are known
        run: python -m r2s profiles

      - name: Fixtures validate against the schema and vocabulary
        run: |
          python -m r2s validate fixtures/agent-system/youtube-automation/expected/inventory.json

      # `convert` exits non-zero when an invariant fails, so this needs no output
      # parsing: the shell already gates on it.
      - name: Gate-survival invariants I1-I7 hold on every profile
        run: |
          python -m r2s convert \
            fixtures/agent-system/youtube-automation/expected/inventory.json --all

      - name: Extraction is deterministic on the cli-tool fixture
        run: |
          python -m r2s extract fixtures/cli-tool/feed-sync --out /tmp/run-a
          python -m r2s extract fixtures/cli-tool/feed-sync --out /tmp/run-b
          diff /tmp/run-a/inventory.draft.json /tmp/run-b/inventory.draft.json

      - name: Every fixture repo extracts without error
        run: |
          for fixture in fixtures/*/*; do
            case "$fixture" in */expected) continue ;; esac
            [ -d "$fixture" ] || continue
            echo "--- $fixture"
            python -m r2s extract "$fixture" --out "/tmp/fx-$(basename "$fixture")"
          done

      - name: The Rust, Go and Java dialects fire on their fixtures
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          expected = {
              "fixtures/library/rust-audit-cli": "rust",
              "fixtures/library/go-queue-runner": "go",
              "fixtures/library/spring-orders-api": "jvm",
          }
          failures = []
          for fixture, dialect in expected.items():
              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(
                      [sys.executable, "-m", "r2s", "extract", fixture, "--out", tmp],
                      check=True,
                      capture_output=True,
                  )
                  draft = json.loads(Path(tmp, "inventory.draft.json").read_text())
              ran = draft["diagnostics"]["dialects_ran"]
              ops = len(draft["operations"])
              if dialect not in ran:
                  failures.append(f"{fixture}: {dialect} did not run (ran: {ran})")
              if ops < 2:
                  failures.append(f"{fixture}: only {ops} operation(s) extracted")
              print(f"{fixture}: {dialect} ran, {ops} operation(s)")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Executing a stand-in writes a real artifact
        run: |
          rm -rf /tmp/exec-out
          python - <<'PY'
          import json
          from pathlib import Path

          from r2s import execute
          from r2s.capability.vocab import StandinCatalog

          result = execute.run(
              "srt-from-text",
              StandinCatalog.load(),
              inputs={"text": "One sentence. And a second one here."},
              workdir=Path("/tmp/exec-out"),
              operation="caption-audio",
          )
          assert result.executed, result.reason
          assert [a["path"] for a in result.artifacts] == ["subtitles.srt"], result.artifacts
          assert Path("/tmp/exec-out/subtitles.srt").is_file()
          print("stand-in executed and wrote its artifact")
          PY

      - name: An unrunnable stand-in fails closed and writes nothing
        run: |
          rm -rf /tmp/exec-blocked
          python - <<'PY'
          import json
          from pathlib import Path

          from r2s import execute
          from r2s.capability.vocab import StandinCatalog

          catalog = StandinCatalog.load()

          # A stand-in with no exec contract must report a reason, never run.
          result = execute.run("reasoning-without-sources", catalog, workdir=Path("/tmp/exec-blocked"))
          assert not result.executed
          assert result.status == execute.STATUS_UNAVAILABLE
          assert result.reason, "an unrunnable stand-in must say why"
          assert result.artifacts == []
          assert not Path("/tmp/exec-blocked").exists() or not any(
              Path("/tmp/exec-blocked").iterdir()
          ), "a blocked stand-in must not create output"

          # A missing required input must also fail closed.
          bad = execute.run("srt-from-text", catalog, inputs={}, workdir=Path("/tmp/exec-blocked"))
          assert bad.status == execute.STATUS_FAILED, bad.status
          assert bad.artifacts == []
          print("both fail-closed paths hold")
          PY

  eval:
    name: eval (L1-L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      # Exits non-zero on any failure. L3/L4 emit a real skill and inspect it, rather
      # than skipping when nobody has run `convert --emit` recently.
      - run: python -m eval

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # `eval` and `mcp` are first-party code and are held to the same bar as `src`.
      - run: ruff check src tests eval mcp
      - run: ruff format --check src tests eval mcp
      - run: mypy
